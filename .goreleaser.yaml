version: 2

project_name: podread

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - binary: podread
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X 'github.com/jspevack/podread-cli/internal/api.Version={{.Version}}'
      - -X 'github.com/jspevack/podread-cli/internal/api.Commit={{.ShortCommit}}'
      - -X 'github.com/jspevack/podread-cli/internal/api.Date={{.Date}}'

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: jesse-spevack
    name: podread-cli
  draft: false
  prerelease: auto
  replace_existing_artifacts: true
  name_template: "v{{.Version}}"

homebrew_casks:
  - name: podread
    binaries:
      - podread
    repository:
      owner: jesse-spevack
      name: homebrew-tap
      git:
        url: "git@github.com:jesse-spevack/homebrew-tap.git"
        private_key: "{{ .Env.TAP_DEPLOY_KEY }}"
    homepage: "https://podread.app/"
    description: "CLI for podread.app - text to speech to your personal podcast feed"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/podread"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
